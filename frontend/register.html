<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <script type="module" src="js/register.js" defer></script>
</head>
<body>
    <h1>Register</h1>
    <form>
        <div>
            <label for="username" class="LP">Username:</label>
            <input type="text" id="username">
        </div>
        <div>
            <label for="email" class="LP">Email:</label>
            <input type="email" id="email">
        </div>
        <div>
            <label for="password" class="LP">Password:</label>
            <input type="password" id="password">
        </div>
        <input type="submit" value="Register">
        <p>if u already have an account <a href="/login.html">login here</a></p>
    </form>
</body>
</html>
