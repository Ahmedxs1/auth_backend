<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create account</title>

    <link rel="stylesheet" href="css/style.css">

    <script
        type="module"
        src="js/register.js"
        defer
    ></script>

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <h1>Create account</h1>

            <p class="auth-subtitle">
                Create your account to join the chat.
            </p>

            <form class="auth-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password-1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password-1"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password-2">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="password-2"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <p
                    id="error-message"
                    class="error-message"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </section>

    </main>

</body>
</html>
