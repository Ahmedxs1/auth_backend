<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

    <script
        type="module"
        src="js/login.js"
        defer
    ></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Login to continue to the chat.
            </p>

            <form class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    id="error-message"
                    class="error-message"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </p>

        </section>

    </main>

</body>
</html>
